<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الراية - تحميل التطبيق</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 450px;
            width: 100%;
        }
        
        /* ===== معرض الصور ===== */
        .gallery-container {
            margin-bottom: 25px;
        }
        
        /* الصورة الرئيسية */
        .main-image {
            position: absolute;
            left: -35%;
            width: 30%;
            height: 125px;
            background: linear-gradient(135deg, #FFD70020, #FFA50020);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
        }
        .main-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;  /* ✅ يجعل الصورة تظهر كاملة بدون قص */
            transition: transform 0.3s ease;
        }
        .main-image img:hover {
            transform: scale(1.02);
        }
        
        /* الصور المصغرة */
        .thumbnails {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .thumbnail {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            opacity: 0.6;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: contain;  /* ✅ الصور المصغرة أيضاً تظهر كاملة */
        }
        .thumbnail:hover {
            transform: translateY(-5px);
            border-color: #FFD700;
            opacity: 1;
        }
        .thumbnail.active {
            border-color: #FFD700;
            opacity: 1;
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        
        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .version {
            color: #FFD700;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .download-btn {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            border-radius: 50px;
            padding: 18px 30px;
            width: 100%;
            font-size: 1.2rem;
            font-weight: bold;
            color: #0a0a0a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }
        .download-btn:hover { transform: scale(1.02); }
        .download-btn:active { transform: scale(0.98); }
        .secondary-btn {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50px;
            padding: 12px 20px;
            width: 100%;
            font-size: 0.9rem;
            color: #FFD700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer {
            margin-top: 30px;
            font-size: 0.7rem;
            color: #555;
        }
        .link-box {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 12px;
            margin-top: 15px;
            word-break: break-all;
            font-size: 0.7rem;
            display: none;
        }
        
        /* زر تبديل وضع العرض (اختياري) */
        .view-mode-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            border: none;
            border-radius: 20px;
            padding: 5px 10px;
            color: #FFD700;
            cursor: pointer;
            font-size: 11px;
        }
        .main-image {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        
        <!-- ===== معرض الصور ===== -->
        <div class="gallery-container">
            <!-- الصورة الرئيسية -->
            <div class="main-image" id="mainImage">
                <img id="mainImg" src="" alt="الراية">
            </div>
            
            <!-- الصور المصغرة -->
            <div class="thumbnails" id="thumbnails">
                <!-- سيتم إضافة الصور بواسطة JavaScript -->
            </div>
        </div>
        
        <h1>الراية</h1>
        <div class="version" id="version">جاري التحميل...</div>
        
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <div>جاري جلب رابط التحميل...</div>
            </div>
        </div>
        
        <div class="footer">
            <p>منبر الحق... صوت الأمة</p>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // ===== قائمة الصور (ضع روابط صورك هنا) =====
        const images = [
            {
                url: "photo/ic_launcher_light-playstore.png",
                alt: "شعار الراية الأبيض"
            },
            {
                url: "photo/ic_launcher_dark-playstore.png",
                alt: "شعار الراية الداكن"
            },
            {
                url: "photo/ic_launcher_alternate-playstore.png",
                alt: "شعار الراية المتناوب"
            },
            {
                url: "photo/ic_launcher-playstore.png",
                alt: "شعار الراية الافتراضي"
            }
        ];
        
        // رابط افتراضي
        const DEFAULT_IMAGE = "https://raw.githubusercontent.com/vvcbvx/raety/main/app/src/main/ic_launcher_light-playstore.png";
        
        let currentMainImage = 0;
        let currentViewMode = 'contain'; // contain أو cover
        
        // عرض الصور المصغرة
        function renderThumbnails() {
            const thumbnailsContainer = document.getElementById('thumbnails');
            const mainImg = document.getElementById('mainImg');
            
            if (images.length > 0 && images[0].url) {
                mainImg.src = images[0].url;
            } else {
                mainImg.src = DEFAULT_IMAGE;
            }
            
            thumbnailsContainer.innerHTML = images.map((img, index) => `
                <div class="thumbnail ${index === 0 ? 'active' : ''}" 
                     data-index="${index}"
                     onmouseenter="changeMainImage(${index})"
                     onclick="changeMainImage(${index})">
                    <img src="${img.url}" alt="${img.alt}" onerror="this.src='${DEFAULT_IMAGE}'">
                </div>
            `).join('');
        }
        
        // تغيير الصورة الرئيسية
        function changeMainImage(index) {
            if (index === currentMainImage) return;
            
            currentMainImage = index;
            const mainImg = document.getElementById('mainImg');
            const newImageUrl = images[index]?.url || DEFAULT_IMAGE;
            
            // تأثير انتقال سلس
            mainImg.style.opacity = '0.5';
            setTimeout(() => {
                mainImg.src = newImageUrl;
                mainImg.style.opacity = '1';
            }, 150);
            
            // تحديث حالة النشاط
            document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
                if (i === index) {
                    thumb.classList.add('active');
                } else {
                    thumb.classList.remove('active');
                }
            });
        }
        
        // ===== باقي كود التحميل =====
        const DIRECT_URL = 'https://huggingface.co/hlhlhhk/app-AL/resolve/main/app-release.apk?download=true';
        const BIN_ID = '6a0733b0c0954111d82a7361';
        const API_KEY = '$2a$10$y4mNOprJ8lAMY0xM8KfYTuehMVndGcLtG2f83auImdb6Oa/wmXGEC';
        
        let downloadUrl = DIRECT_URL;
        
        async function getDownloadUrl() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                
                if (!response.ok) throw new Error('فشل الاتصال');
                
                const data = await response.json();
                const record = data.record || data;
                const url = record.directApkUrl || record.appDownloadUrl || '';
                const version = record.appVersion || '1.0.0';
                
                return { url: url || DIRECT_URL, version };
            } catch (error) {
                console.error('خطأ:', error);
                return { url: DIRECT_URL, version: '1.0.0' };
            }
        }
        
        function startDownload() {
            if (!downloadUrl) {
                alert('رابط التحميل غير متوفر حالياً');
                return;
            }
            window.location.href = downloadUrl;
            
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <div style="color: #28a745; margin: 10px 0;">
                    <i class="fas fa-check-circle"></i> جاري فتح رابط التحميل...
                </div>
                <div class="link-box" id="linkBox" style="display: flex; flex-direction: column; gap: 10px;">
                    <p>إذا لم يبدأ التحميل تلقائياً، اضغط على الرابط:</p>
                    <a href="${downloadUrl}" target="_blank" style="color: #FFD700;">${downloadUrl.substring(0, 80)}...</a>
                </div>
            `;
        }
        
        function copyUrl() {
            navigator.clipboard.writeText(downloadUrl);
            alert('✅ تم نسخ الرابط');
        }
        
        async function init() {
            renderThumbnails();
            
            const contentDiv = document.getElementById('content');
            const versionDiv = document.getElementById('version');
            
            const { url, version } = await getDownloadUrl();
            downloadUrl = url;
            versionDiv.innerHTML = `الإصدار ${version}`;
            
            contentDiv.innerHTML = `
                <button class="download-btn" onclick="startDownload()">
                    <i class="fas fa-download"></i> تحميل التطبيق
                </button>
                <button class="secondary-btn" onclick="copyUrl()">
                    <i class="fas fa-copy"></i> نسخ رابط التحميل
                </button>
                <div class="link-box" id="linkBox">
                    <small>رابط التحميل: </small>
                    <a href="${downloadUrl}" target="_blank" style="color: #FFD700; font-size: 0.7rem; word-break: break-all;">${downloadUrl.substring(0, 60)}...</a>
                </div>
            `;
            
            const linkBox = document.getElementById('linkBox');
            if (linkBox) linkBox.style.display = 'block';
        }
        
        init();
    </script>
</body>
</html>
