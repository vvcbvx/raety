<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الراية - تحميل التطبيق</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 400px;
            width: 100%;
        }
        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .logo i { font-size: 50px; color: #0a0a0a; }
        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .version {
            color: #FFD700;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .download-btn {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            border-radius: 50px;
            padding: 18px 30px;
            width: 100%;
            font-size: 1.2rem;
            font-weight: bold;
            color: #0a0a0a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }
        .download-btn:hover { transform: scale(1.02); }
        .download-btn:active { transform: scale(0.98); }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #ff6b6b; font-size: 0.9rem; margin-top: 15px; }
        .footer {
            margin-top: 40px;
            font-size: 0.7rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="logo">
            <i class="fas fa-flag-checkered"></i>
        </div>
        <h1>الراية</h1>
        <div class="version" id="version">جاري التحميل...</div>
        
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <div>جاري تحميل رابط التحميل...</div>
            </div>
        </div>
        
        <div class="footer">
            <p>منبر الحق... صوت الأمة</p>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // إعدادات JSONBin
        const BIN_ID = '6a0733b0c0954111d82a7361';
        const API_KEY = '$2a$10$y4mNOprJ8lAMY0xM8KfYTuehMVndGcLtG2f83auImdb6Oa/wmXGEC';
        
        async function getDownloadUrl() {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            
            if (!response.ok) throw new Error('فشل الاتصال');
            
            const data = await response.json();
            const record = data.record || data;
            
            // استخراج الرابط من الحقول المختلفة
            const url = record.appDownloadUrl || record.directApkUrl || '';
            
            return { url, version: record.appVersion || '1.0.0' };
        }
        
        async function init() {
            const contentDiv = document.getElementById('content');
            const versionDiv = document.getElementById('version');
            
            try {
                const { url, version } = await getDownloadUrl();
                versionDiv.innerHTML = `الإصدار ${version}`;
                
                if (url && url !== '') {
                    // ✅ عرض زر التحميل
                    contentDiv.innerHTML = `
                        <button class="download-btn" onclick="startDownload()">
                            <i class="fas fa-download"></i> تحميل التطبيق
                        </button>
                    `;
                    
                    // حفظ الرابط لاستخدامه لاحقاً
                    window.downloadUrl = url;
                    
                } else {
                    contentDiv.innerHTML = `
                        <div class="error">
                            <i class="fas fa-exclamation-circle"></i> رابط التحميل غير متوفر حالياً
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error(error);
                contentDiv.innerHTML = `
                    <div class="error">
                        <i class="fas fa-wifi"></i> خطأ في الاتصال، حاول مرة أخرى
                        <button onclick="location.reload()" style="display: block; margin: 15px auto 0; background: #FFD700; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer;">إعادة المحاولة</button>
                    </div>
                `;
            }
        }
        
        function startDownload() {
            const url = window.downloadUrl;
            if (url) {
                // ✅ فتح الرابط مباشرة
                window.location.href = url;
            }
        }
        
        init();
    </script>
</body>
</html>
