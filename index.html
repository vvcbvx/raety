<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الراية - تحميل التطبيق</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 400px;
            width: 100%;
        }
        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .logo i { font-size: 50px; color: #0a0a0a; }
        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .version {
            color: #FFD700;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .download-btn {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            border-radius: 50px;
            padding: 18px 30px;
            width: 100%;
            font-size: 1.2rem;
            font-weight: bold;
            color: #0a0a0a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }
        .download-btn:hover { transform: scale(1.02); }
        .download-btn:active { transform: scale(0.98); }
        .secondary-btn {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50px;
            padding: 12px 20px;
            width: 100%;
            font-size: 0.9rem;
            color: #FFD700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #ff6b6b; font-size: 0.9rem; margin-top: 15px; }
        .success { color: #28a745; font-size: 0.9rem; margin-top: 15px; }
        .footer {
            margin-top: 40px;
            font-size: 0.7rem;
            color: #555;
        }
        .link-box {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 12px;
            margin-top: 15px;
            word-break: break-all;
            font-size: 0.7rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="logo">
            <i class="fas fa-flag-checkered"></i>
        </div>
        <h1>الراية</h1>
        <div class="version" id="version">جاري التحميل...</div>
        
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <div>جاري جلب رابط التحميل...</div>
            </div>
        </div>
        
        <div class="footer">
            <p>منبر الحق... صوت الأمة</p>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // الرابط المباشر الثابت (كحل أخير)
        const DIRECT_URL = 'https://huggingface.co/hlhlhhk/app-AL/resolve/main/app-release.apk?download=true';
        
        // إعدادات JSONBin
        const BIN_ID = '6a0733b0c0954111d82a7361';
        const API_KEY = '$2a$10$y4mNOprJ8lAMY0xM8KfYTuehMVndGcLtG2f83auImdb6Oa/wmXGEC';
        
        let downloadUrl = DIRECT_URL;
        
        async function getDownloadUrl() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                
                if (!response.ok) throw new Error('فشل الاتصال');
                
                const data = await response.json();
                const record = data.record || data;
                
                // استخراج الرابط
                const url = record.directApkUrl || record.directApkUrl || '';
                const version = record.appVersion || '1.0.0';
                
                return { url: url || DIRECT_URL, version };
                
            } catch (error) {
                console.error('خطأ:', error);
                return { url: DIRECT_URL, version: '1.0.0' };
            }
        }
        
        function startDownload() {
            if (!downloadUrl) {
                alert('رابط التحميل غير متوفر حالياً');
                return;
            }
            
            // ✅ الطريقة الأكثر ضماناً: فتح الرابط في نفس النافذة
            window.location.href = downloadUrl;
            
            // عرض رسالة للمستخدم
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <div class="success">
                    <i class="fas fa-check-circle"></i> جاري فتح رابط التحميل...
                </div>
                <div class="link-box" id="linkBox" style="display: flex; flex-direction: column; gap: 10px;">
                    <p>إذا لم يبدأ التحميل تلقائياً، اضغط على الرابط:</p>
                    <a href="${downloadUrl}" target="_blank" style="color: #FFD700; word-break: break-all;">${downloadUrl.substring(0, 80)}...</a>
                </div>
            `;
        }
        
        function copyUrl() {
            navigator.clipboard.writeText(downloadUrl);
            alert('تم نسخ الرابط');
        }
        
        async function init() {
            const contentDiv = document.getElementById('content');
            const versionDiv = document.getElementById('version');
            
            const { url, version } = await getDownloadUrl();
            downloadUrl = url;
            versionDiv.innerHTML = `الإصدار ${version}`;
            
            // عرض زر التحميل
            contentDiv.innerHTML = `
                <button class="download-btn" onclick="startDownload()">
                    <i class="fas fa-download"></i> تحميل التطبيق
                </button>
                <button class="secondary-btn" onclick="copyUrl()">
                    <i class="fas fa-copy"></i> نسخ رابط التحميل
                </button>
                <div class="link-box" id="linkBox">
                    <small>رابط التحميل: </small>
                    <a href="${downloadUrl}" target="_blank" style="color: #FFD700; font-size: 0.7rem; word-break: break-all;">${downloadUrl.substring(0, 60)}...</a>
                </div>
            `;
            
            // إظهار صندوق الرابط
            document.getElementById('linkBox').style.display = 'block';
        }
        
        init();
    </script>
</body>
</html>
